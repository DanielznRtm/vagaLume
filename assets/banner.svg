      .sub { font: 500 19px "SG", "Segoe UI", Helvetica, Arial, sans-serif; fill: #8fa79b; letter-spacing: .2px; }
      .b { animation: blink ease-in-out infinite; }
      .f { animation: drift ease-in-out infinite; }
      .orb { animation: pulse 3.6s ease-in-out infinite; transform-origin: 1012px 180px; }
      @keyframes blink { 0%, 100% { opacity: .08; } 40%, 60% { opacity: 1; } }
      @keyframes drift { 0%, 100% { transform: translate(0, 0); } 33% { transform: translate(14px, -10px); } 66% { transform: translate(-10px, 8px); } }
      @keyframes pulse { 0%, 100% { transform: scale(.92); opacity: .85; } 50% { transform: scale(1.06); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .b, .f, .orb { animation: none; } }
    </style>
