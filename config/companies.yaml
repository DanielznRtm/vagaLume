# Companies whose public job boards the radar reads every day.
#
# To add a company:
#   1. Open its careers page and click any job. Look at the job's URL:
#        boards.greenhouse.io/<slug>/...   or job-boards.greenhouse.io/<slug>/...  -> greenhouse
#        jobs.lever.co/<slug>/...                                                    -> lever
#        jobs.ashbyhq.com/<slug>/...                                                 -> ashby
#   2. Add "- {slug: <slug>, name: <Company name>}" under the right heading.
#   3. Run `python -m radar check-config` to confirm the slug returns jobs.
#
# Only student-level postings are kept (intern, estágio, student, fellow,
# program, summer, residency...). See radar/labels.py for the exact words.
#
# All active slugs below were verified on 2026-10-05.
# Commented-out entries did NOT return a job board; they are listed in the
# README under "Companies that could not be added".

