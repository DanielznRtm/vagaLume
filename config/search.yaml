# Settings for the sources that search instead of reading company boards.

# Curated GitHub lists.
#   kind:   internship | new-grad
#   season: (optional) season for every row, when the list is all one season
github_lists:
  - name: SimplifyJobs Summer 2027
    url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/README.md
    kind: internship
    season: May–Aug
  - name: SimplifyJobs Off-Season 2027
    url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/README-Off-Season.md
    kind: internship
  - name: SimplifyJobs New Grad
    url: https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/README.md
    kind: new-grad
    season: year-round
  - name: vanshb03 Summer 2027
    url: https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/dev/README.md
    kind: internship
    season: May–Aug

# Gupy (portal.gupy.io): job types to collect, comma-joined in one search.
# Internships, estágio de férias and trainee programs: ~2,700 roles.
# Add vacancy_type_apprentice for jovem aprendiz (14-24 years old, not
# university students; about 2,300 more).
gupy_types:
  - vacancy_type_internship
  - vacancy_type_summer
  - vacancy_type_trainee

# Google Careers: searches at the "intern & apprentice" level.
google_queries:
  - intern
  - student researcher
  - STEP

# Amazon Jobs searches.
amazon_queries:
  - intern
  - internship

# Microsoft careers searches.
microsoft_queries:
  - intern
  - student

# NVIDIA (Workday). The facet id below means "worker sub type = Intern
# (Fixed Term)". If NVIDIA changes it, set applied_facets to {} and
# search_text to "intern" to fall back to a title search.
nvidia:
  search_text: ""
  applied_facets:
    workerSubType: ["0c40f6bd1d8f10adf6dae42e46d44a17"]

# CIEE (portal.ciee.org.br): school levels to collect.
# SU = higher education (graduação), TE = technical, EM = high school.
ciee_levels: [SU]

# Super Estágios: school levels to keep (the start of its "nivel_ensino"):
# Superior, Técnico, Médio, Pós-Graduação... An empty list keeps everything.
superestagios_levels: [Superior]
