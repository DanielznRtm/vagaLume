<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vagaLume</title>
<meta name="description" content="Student internships, research programs, fellowships and schools, collected every morning and sorted by how well they fit you.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23c9e84a' fill-opacity='.35'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23c9e84a'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23fffbe0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<!--
  vagaLume's whole web interface is this one file: no frameworks, no build
  step. It downloads data.json (written by the bot on every run) and shows it.
  Your profile, résumé summary, saved roles and Applied / Hide clicks stay in
  this browser (localStorage); nothing is sent anywhere.

  Every text on the page is in STRINGS (English and Brazilian Portuguese),
  at the top of the script. To add a language, add a column there.
-->
<style>
  /* Layout: a filter rail on the left and a quiet list of roles on the right;
     each row expands in place. Identity: a night-forest teal for ink and
     controls, and one firefly "lume" glow used only for the brand. */
  :root {
    --paper: #f3f6f2;      /* page background, faint green-grey */
    --surface: #ffffff;    /* rows, panels */
    --ink: #142019;        /* text */
    --muted: #5a6861;      /* secondary text */
    --faint: #87938c;      /* tertiary text: counts, empty values */
    --line: #dce3dd;       /* hairlines */
    --accent: #0c6a5b;     /* night-forest teal: links, selected states */
    --accent-soft: #e0efe9;
    --lume: #c9e84a;       /* firefly glow (brand only) */
    --good: #1d7a3d;  --good-soft: #e2f3e6;
    --check: #9a5a00; --check-soft: #fbefdb;
    --long: #b3261e;  --long-soft: #fbe4e2;
    --semester: #d8dfd9;   /* month strip: months in class */
    --break: #f3f6f2;      /* month strip: break months */
    --mark-bg: #f6f0a8;    /* search highlight */

    --font-display: "Bricolage Grotesque", "Schibsted Grotesk", system-ui, sans-serif;
    --font-body: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

    --radius: 10px;
    --gutter: 16px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0e1411; --surface: #151d19; --ink: #e5ece7; --muted: #94a39b; --faint: #6c7a73; --line: #25302a;
      --accent: #5cc3ac; --accent-soft: #16322a; --lume: #d4f05a;
      --good: #74d391; --good-soft: #152f20; --check: #f0b45e; --check-soft: #342711; --long: #ff8d80; --long-soft: #3a1b18;
      --semester: #2a352f; --break: #151d19; --mark-bg: #4b4a12;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0e1411; --surface: #151d19; --ink: #e5ece7; --muted: #94a39b; --faint: #6c7a73; --line: #25302a;
    --accent: #5cc3ac; --accent-soft: #16322a; --lume: #d4f05a;
    --good: #74d391; --good-soft: #152f20; --check: #f0b45e; --check-soft: #342711; --long: #ff8d80; --long-soft: #3a1b18;
    --semester: #2a352f; --break: #151d19; --mark-bg: #4b4a12;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .none { color: var(--faint); }
  mark { background: var(--mark-bg); color: inherit; border-radius: 2px; padding: 0 1px; }

  /* ---------- brand ---------- */
  .brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 500; letter-spacing: -.01em; color: var(--ink); text-decoration: none; }
  .brand b { font-weight: 700; }
  .lume { position: relative; width: 26px; height: 26px; flex: none; display: grid; place-items: center; }
  .lume::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, var(--lume) 0 32%, color-mix(in srgb, var(--lume) 45%, transparent) 33% 55%, transparent 72%); }
  .lume::after { content: ""; position: relative; width: 7px; height: 7px; border-radius: 50%; background: #fffbe0; box-shadow: 0 0 6px 2px var(--lume); }

  /* ---------- language switch ---------- */
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 2px; }
  .lang button { border: 0; background: none; padding: 3px 9px; border-radius: 999px; cursor: pointer; font-size: .78rem; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

  /* ---------- welcome and résumé screens ---------- */
  .welcome { min-height: 100vh; display: grid; place-items: center; padding: 32px var(--gutter); position: relative; overflow: hidden; }
  .fireflies { position: absolute; inset: 0; pointer-events: none; }
  .fireflies i { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--lume); box-shadow: 0 0 10px 3px var(--lume); opacity: .55; }
  .welcome-card { width: 100%; max-width: 640px; display: grid; gap: 26px; position: relative; }
  .card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px; }
  .card-head .side { display: flex; align-items: center; gap: 16px; }
  .welcome .brand { font-size: 1.15rem; }
  .welcome h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.1rem, 6.2vw, 3.1rem); line-height: 1.04; margin: 0; text-wrap: balance; letter-spacing: -.02em; }
  .welcome h1 em { font-style: normal; background: linear-gradient(transparent 62%, color-mix(in srgb, var(--lume) 70%, transparent) 62%); padding: 0 .08em; }
  .welcome p.lead { margin: 12px 0 0; color: var(--muted); font-size: 1.05rem; max-width: 54ch; }
  .question { display: grid; gap: 10px; }
  .question h2 { margin: 0; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .level { text-align: left; padding: 14px 14px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer; display: grid; gap: 2px; }
  .level b { font-size: 1.02rem; }
  .level span { font-size: .85rem; color: var(--muted); }
  .level[aria-pressed="true"], .place[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
  .places { display: flex; flex-wrap: wrap; gap: 8px; }
  .place { padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; }
  .welcome-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
  .primary { padding: 12px 20px; border: 0; border-radius: var(--radius); background: var(--accent); color: var(--surface); font-weight: 600; cursor: pointer; }
  .primary:disabled { opacity: .45; cursor: not-allowed; }
  .linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .welcome .fineprint { font-size: .85rem; color: var(--muted); margin: 0; }
  .resume-hint { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; }

  .resume-card { max-width: 700px; gap: 22px; }
  .resume-card h1 { font-size: clamp(1.9rem, 5.4vw, 2.6rem); }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 22px; counter-reset: step; }
  .step { display: grid; grid-template-columns: 32px minmax(0, 1fr); column-gap: 14px; }
  .step::before { counter-increment: step; content: counter(step); grid-row: 1 / span 6; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-family: var(--font-data); font-weight: 500; }
  .step > * { grid-column: 2; }
  .step h2 { margin: 3px 0 2px; font-size: 1.05rem; }
  .step p { margin: 0 0 10px; color: var(--muted); }
  textarea { width: 100%; font: .82rem/1.5 var(--font-data); padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); resize: vertical; }
  #prompt-text { height: 140px; color: var(--muted); }
  #answer { height: 130px; }
  .button-row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-top: 10px; }
  .copied { color: var(--good); font-size: .9rem; }
  .error { color: var(--long); font-size: .9rem; margin: 8px 0 0 !important; }
  .resume-summary { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 12px; }
  .resume-summary h2 { margin: 0; font-size: 1.05rem; }
  .resume-summary p { margin: 0; }
  .facts-list { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; align-content: start; }
  .facts-list dt { color: var(--muted); }
  .facts-list dd { margin: 0; min-width: 0; }

  /* ---------- app shell ---------- */
  .app { max-width: 1320px; margin: 0 auto; padding: 18px var(--gutter) 48px; }
  .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; margin-bottom: 24px; }
  .topbar .brand { font-size: 1.4rem; }
  .top-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pill-btn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; text-decoration: none; color: var(--ink); font-size: .9rem; }
  .pill-btn:hover { border-color: var(--muted); }
  .pill-btn svg { color: var(--muted); flex: none; }
  .pill-btn .done { color: var(--good); font-weight: 700; }
  .pill-btn.icon-only { padding: 6px 9px; }

  .layout { display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 34px; align-items: start; }

  /* filters */
  .filters { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; scrollbar-width: thin; }
  .filters > summary { display: none; }
  .filters-body { display: grid; gap: 22px; padding-bottom: 8px; }
  .fgroup { display: grid; gap: 8px; }
  .fgroup h3 { margin: 0; font-size: .82rem; color: var(--muted); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips:empty { display: none; }
  .chip { padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: .86rem; white-space: nowrap; }
  .chip small { color: var(--faint); font-family: var(--font-data); font-size: .7rem; margin-left: 5px; }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .chip[aria-pressed="true"] small { color: inherit; opacity: .7; }
  .chip.zero { opacity: .4; }
  .more-filters > summary { cursor: pointer; font-size: .86rem; color: var(--muted); list-style: none; }
  .more-filters > summary::-webkit-details-marker { display: none; }
  .more-filters > summary::before { content: "+ "; }
  .more-filters[open] > summary::before { content: "− "; }
  .more-filters[open] > summary { margin-bottom: 12px; }
  .more-filters .fgroup + .fgroup { margin-top: 16px; }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: .9rem; cursor: pointer; }
  select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); width: 100%; }

  /* toolbar */
  .toolbar { display: grid; gap: 14px; margin-bottom: 4px; }
  .search { position: relative; }
  .search input { width: 100%; padding: 11px 44px 11px 38px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); font-size: 1rem; }
  .search > svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-family: var(--font-data); font-size: .75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; background: var(--paper); }
  .tabs-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 4px 10px; border-bottom: 1px solid var(--line); }
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 7px 10px 9px; cursor: pointer; color: var(--muted); font-weight: 500; margin-bottom: -1px; white-space: nowrap; }
  .tab small { font-family: var(--font-data); font-size: .72rem; margin-left: 5px; color: var(--faint); }
  .tab small.hot { color: var(--long); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .sort { display: flex; align-items: center; gap: 2px; font-size: .88rem; color: var(--muted); padding-bottom: 5px; }
  .sort select { width: auto; color: var(--ink); border-color: transparent; background: none; padding-inline: 4px; cursor: pointer; font-weight: 500; }
  .sort select:hover { border-color: var(--line); }

  .active-filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .active-filters:empty { display: none; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-size: .85rem; cursor: pointer; }
  .pill svg { color: var(--accent); }
  .count-line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; align-items: center; margin: 10px 2px 8px; font-size: .85rem; color: var(--muted); position: relative; }
  .legend-btn { background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); font-size: .85rem; display: inline-flex; gap: 6px; align-items: center; }
  .legend-btn:hover { color: var(--ink); }
  .legend-btn .q { width: 17px; height: 17px; border-radius: 50%; border: 1px solid currentColor; display: inline-grid; place-items: center; font-size: .68rem; font-weight: 700; }
  .legend { position: absolute; right: 0; top: calc(100% + 6px); z-index: 5; width: min(360px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 24px rgb(0 0 0 / .16); padding: 14px 16px; display: grid; gap: 8px; color: var(--ink); font-size: .86rem; }
  .legend div { display: flex; align-items: center; gap: 10px; }
  .legend .dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; display: inline-block; flex: none; }
  .legend .sq { width: 11px; height: 11px; border-radius: 2px; display: inline-block; flex: none; }

  /* list */
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .cols, .row-main { display: grid; grid-template-columns: 20px minmax(0, 2.7fr) minmax(0, 1.25fr) minmax(0, .85fr) 80px 76px 66px; gap: 16px; align-items: center; padding: 0 14px; }
  .cols { font-size: .76rem; color: var(--faint); font-weight: 500; padding-block: 9px; border-bottom: 1px solid var(--line); }
  .row { border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row-main { padding-block: 13px; cursor: pointer; }
  .row-main:hover { background: color-mix(in srgb, var(--accent-soft) 40%, transparent); }
  .row.open .row-main { background: var(--accent-soft); }
  .role { min-width: 0; }
  .role a { color: var(--ink); font-weight: 600; text-decoration: none; }
  .role a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .role .org { color: var(--muted); font-size: .88rem; display: flex; flex-wrap: wrap; gap: 0 12px; align-items: center; }
  .why { font-size: .8rem; margin-top: 1px; }
  .why.c1 { color: var(--check); } .why.c2 { color: var(--long); }
  .tag { font-size: .78rem; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
  .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .tag.new { color: var(--accent); }
  .tag.applied { color: var(--good); }
  .tag.match { color: var(--good); }
  .tag.program { color: var(--muted); font-weight: 500; }
  .where { min-width: 0; font-size: .9rem; }
  .where .first { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .where .more { color: var(--faint); font-size: .8rem; }
  .pay { font-family: var(--font-data); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deadline { font-family: var(--font-data); font-size: .85rem; line-height: 1.3; }
  .deadline small { display: block; font-family: var(--font-body); font-size: .76rem; }
  .deadline.soon { color: var(--long); font-weight: 500; }
  .deadline.past { color: var(--faint); text-decoration: line-through; }
  .meta-line { display: none; }
  .when-text { font-size: .82rem; color: var(--muted); }

  .fit { width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; justify-self: center; }
  .fit.good { color: var(--good); background: var(--good); }
  .fit.check { color: var(--check); background: var(--check-soft); }
  .fit.long { color: var(--long); background: transparent; }
  .fit.none { color: var(--line); }

  .months { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; width: 76px; }
  .months i { height: 12px; border-radius: 2px; background: var(--break); box-shadow: inset 0 0 0 1px var(--line); }
  .months i.sem { background: var(--semester); box-shadow: none; }
  .months i.on { background: var(--good); box-shadow: none; }
  .months i.on.sem { background: var(--check); }
  .months.unknown { opacity: .4; }
  .facts-list .months { margin-top: 5px; }

  .actions { display: flex; gap: 4px; justify-content: flex-end; }
  .icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid transparent; border-radius: 8px; background: none; cursor: pointer; color: var(--faint); }
  .icon-btn:hover { color: var(--ink); border-color: var(--line); background: var(--surface); }
  .icon-btn.save[aria-pressed="true"] { color: var(--check); }
  .icon-btn.hide[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
  /* Hide (✕) only shows on hover; on touch screens it's inside the opened row. */
  @media (hover: hover) {
    .row .icon-btn.hide { opacity: 0; }
    .row:hover .icon-btn.hide, .row:focus-within .icon-btn.hide, .row .icon-btn.hide[aria-pressed="true"] { opacity: 1; }
  }
  @media (hover: none) { .row-main .icon-btn.hide:not([aria-pressed="true"]) { display: none; } }

  .details { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px 40px; padding: 6px 14px 18px 50px; background: var(--accent-soft); font-size: .9rem; }
  .details h4 { margin: 0 0 6px; font-size: .95rem; }
  .details p { margin: 0 0 6px; }
  .details ul { margin: 0; padding-left: 18px; }
  .details li { margin-bottom: 2px; }
  .reasons li.long { color: var(--long); } .reasons li.check { color: var(--check); }
  .for-you { display: grid; gap: 16px; align-content: start; }
  .skill-list { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 6px; }
  .skill { padding: 1px 9px; border-radius: 999px; background: var(--accent-soft); font-size: .82rem; }
  .details .skill { background: var(--surface); }
  .skill.hit { background: var(--good-soft) !important; color: var(--good); font-weight: 600; }
  .skill.miss { background: none !important; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--muted) 35%, transparent); color: var(--muted); }
  .detail-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; text-decoration: none; color: var(--ink); }
  .btn.primary-link { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  .btn[aria-pressed="true"] { border-color: var(--good); color: var(--good); background: var(--good-soft); }

  .more-btn { display: block; margin: 16px auto 0; padding: 9px 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
  .empty, .loading { padding: 40px 16px; text-align: center; color: var(--muted); }
  .loading .lume { margin: 0 auto 12px; }
  .to-top { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: grid; place-items: center; box-shadow: 0 4px 14px rgb(0 0 0 / .12); }

  footer { margin-top: 40px; display: grid; gap: 14px; font-size: .9rem; }
  footer details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
  footer summary { cursor: pointer; font-weight: 600; }
  footer p { max-width: 75ch; }
  .footer-line { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: .85rem; }
  .swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; vertical-align: -1px; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .86rem; }
  td, th { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }

  /* ---------- small screens ---------- */
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 14px; }
    main { min-width: 0; }
    .filters { position: static; max-height: none; overflow: visible; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; }
    .filters > summary { display: list-item; cursor: pointer; font-weight: 600; }
    .filters[open] > summary { margin-bottom: 14px; }
    .cols { display: none; }
    /* One quiet line under the title instead of four columns. */
    .row-main { grid-template-columns: 14px minmax(0, 1fr) auto; column-gap: 12px; }
    .row-main > .fit { align-self: start; margin-top: 6px; }
    .row-main > .actions { align-self: start; }
    .row-main > .where, .row-main > .pay, .row-main > .when, .row-main > .deadline { display: none; }
    .meta-line { display: block; font-size: .84rem; color: var(--muted); margin-top: 3px; }
    .meta-line .soon { color: var(--long); font-weight: 500; }
    .details { grid-template-columns: minmax(0, 1fr); padding-left: 40px; }
    .levels { grid-template-columns: minmax(0, 1fr); }
    .tabs-row { display: grid; gap: 4px; border-bottom: 0; }
    .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; border-bottom: 1px solid var(--line); }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: none; }
    .search kbd { display: none; }
    .pill-btn .label { display: none; }
    .facts-list { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .facts-list dd { margin-bottom: 8px; }
  }
  /* Touch screens: controls at least ~40px so they're easy to hit. */
  @media (pointer: coarse) {
    .icon-btn { width: 42px; height: 42px; border-radius: 10px; }
    .chip { padding: 8px 13px; font-size: .92rem; }
    .chips { gap: 8px; }
    .tab { padding: 12px 12px 13px; }
    .check-row { min-height: 40px; }
    .check-row input { width: 20px; height: 20px; }
    .filters > summary, footer summary, .more-filters > summary { padding-block: 8px; }
    .linkish, .legend-btn { padding-block: 8px; }
    select, .pill-btn, .pill { min-height: 42px; }
    .lang button { min-height: 36px; padding-inline: 12px; }
    .btn { min-height: 44px; }
    .row-main:active { background: var(--accent-soft); }
  }
  @media (prefers-reduced-motion: no-preference) {
    .row-main, .chip, .tab, .icon-btn { transition: background-color .12s, color .12s, border-color .12s, opacity .12s; }
    .lume::before { animation: glow 3.2s ease-in-out infinite; }
    .fireflies i { animation: drift 9s ease-in-out infinite, blink 3.4s ease-in-out infinite; }
    .fireflies i:nth-child(2n) { animation-duration: 12s, 4.1s; }
    .fireflies i:nth-child(3n) { animation-duration: 10s, 2.7s; animation-delay: -3s, -1s; }
    @keyframes glow { 0%, 100% { opacity: .75; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes blink { 0%, 100% { opacity: .1; } 45%, 60% { opacity: .75; } }
    @keyframes drift { 0%, 100% { translate: 0 0; } 33% { translate: 18px -14px; } 66% { translate: -12px 10px; } }
  }
</style>

  "areas": ["1 to 3 of: ML, research, SWE, data, quant, hardware"],
  "skills": ["10 to 40 skills, see the rules"],
  "target_roles": ["3 to 6 short keywords for roles that suit me, as they'd appear in job titles, e.g. machine learning, robotics, quant"],
  "available_months": [month numbers 1-12 when I could do a full-time internship]
}

Rules:
- Use only what the résumé shows. If something isn't there, use "" or [] instead of guessing. For available_months, if the résumé doesn't say, use the usual academic breaks of my university's country (for example Brazil: [1, 2, 7, 12]).
- For "skills", first pick every item of this list that the résumé shows, spelled exactly as here: ${vocabulary}. Then add up to 10 other important skills.
- Don't include my name, email, phone, address, links or any other personal detail.

}

// Other ways an AI may write a skill -> the name the bot uses (lower case).
const SKILL_ALIASES = {
  "ros2": "ros", "ros 2": "ros", "sklearn": "scikit-learn", "golang": "go", "postgresql": "sql", "mysql": "sql",
  "llm": "llms", "large language models": "llms", "generative ai": "llms", "ml": "machine learning",
  "cv": "computer vision", "opencv": "computer vision", "rl": "reinforcement learning", "clp": "plc",
  "js": "javascript", "node": "node.js", "nodejs": "node.js", "control theory": "control systems", "control": "control systems",
  "embedded": "embedded systems", "firmware": "embedded systems", "microcontrollers": "embedded systems",
  "neural networks": "deep learning", "torch": "pytorch", "tf": "tensorflow", "powerbi": "power bi",
  "solidworks": "cad", "autocad": "cad", "dsp": "signal processing", "statistical analysis": "statistics",
  "google cloud": "gcp", "amazon web services": "aws", "ci-cd": "ci/cd", "flask": "fastapi", "scada systems": "scada",
};
function skillKeys(skills) {
  const keys = new Set();
  const addKey = s => { const k = s.trim().toLowerCase(); if (k) keys.add(SKILL_ALIASES[k] || k); };
  for (const skill of skills) {
    addKey(skill);
    if (!/^ci\/cd$/i.test(skill)) skill.split(/[\/(),;]| and /).forEach(addKey);  // "C/C++", "Python (NumPy, Pandas)"
  }
  return keys;
}
let mySkills = skillKeys(resume?.skills || []);

// Read the AI's answer: a JSON object, maybe inside ```json fences or surrounded by chatter.
function parseResume(text) {
  let s = String(text || "").replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
  const fenced = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fenced && fenced[1].includes("{")) s = fenced[1];
  const start = s.indexOf("{"), end = s.lastIndexOf("}");
  if (start < 0 || end <= start) throw new Error(t("err.noJson"));
  let raw;
  const body = s.slice(start, end + 1);
  try { raw = JSON.parse(body); } catch {
    try { raw = JSON.parse(body.replace(/,\s*([}\]])/g, "$1")); }  // a trailing comma is a common slip
    catch { throw new Error(t("err.badJson")); }
  }
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) throw new Error(t("err.notObject"));
  const list = v => (Array.isArray(v) ? v : typeof v === "string" ? v.split(/[,;]/) : []).map(x => String(x).trim()).filter(Boolean);
  const lvl = String(raw.level || "").toLowerCase();
  const months = list(raw.available_months).map(m => {
    const n = parseInt(m, 10);
    return n >= 1 && n <= 12 ? n : MONTH_KEYS.findIndex(x => m.toLowerCase().startsWith(x.toLowerCase())) + 1;
  }).filter(n => n > 0);
  const out = {
    level: /phd|doctor|doutor/.test(lvl) ? "phd" : /master|mestr|msc/.test(lvl) ? "masters" : /under|bachel|gradua|bsc/.test(lvl) ? "undergrad" : "",
    field: String(raw.field || "").trim(),
    country: String(raw.study_country || "").trim(),
    graduation: /^\d{4}(-\d{1,2})?/.test(String(raw.graduation || "")) ? String(raw.graduation).trim().slice(0, 7).replace(/-(\d)$/, "-0$1") : "",
    workAuth: list(raw.work_authorization),
    languages: list(raw.languages),
    areas: list(raw.areas).map(a => AREA_ORDER.find(x => x.toLowerCase() === a.toLowerCase())).filter(Boolean),
    skills: [...new Set(list(raw.skills))].slice(0, 60),
    roles: list(raw.target_roles).slice(0, 10),
    months: [...new Set(months)].sort((a, b) => a - b),
  };
  if (!out.skills.length && !out.level) throw new Error(t("err.empty"));
  return out;
}

// {score 0-100, level: 0 strong | 1 good | 2 some | 3 low, have, missing, area, role} or null without a résumé.
const LANGUAGES = new Set(["Python", "C++", "C", "C#", "Java", "JavaScript", "TypeScript", "Go", "Rust", "Kotlin", "Swift", "Scala", "OCaml", "Haskell", "R", "MATLAB"]);
function computeMatch(item) {
  if (!resume) return null;
  const asks = item.skills || [];
  const have = asks.filter(s => mySkills.has(s.toLowerCase()));
  const missing = asks.filter(s => !mySkills.has(s.toLowerCase()));
  // Programming languages usually come as alternatives ("Java, Python, C++ or Go"): knowing one counts as one hit.
  const langs = asks.filter(s => LANGUAGES.has(s));
  const needed = asks.length - langs.length + (langs.length ? 1 : 0);
  const got = have.filter(s => !LANGUAGES.has(s)).length + (have.some(s => LANGUAGES.has(s)) ? 1 : 0);
  const area = resume.areas.includes(item.area);
  const title = ` ${item.title.toLowerCase()} `;
  const role = resume.roles.find(r => r.length > 1 && new RegExp(`[^a-z]${r.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}[^a-z]`).test(title));
  // Full marks for skills when you have 60% of what the posting mentions (at least 3 of them).
  const skillPart = needed ? Math.min(1, got / Math.max(3, Math.ceil(needed * 0.6))) : 0;
  const score = Math.round(55 * skillPart + (area ? 25 : 0) + (role ? 20 : 0));
  return { score, level: score >= 70 ? 0 : score >= 45 ? 1 : score >= 20 ? 2 : 3, have, missing, area, role };
}

function setResume(value) {
  resume = value;
  mySkills = skillKeys(resume?.skills || []);
  store.set("radar.resume", value);
  if (value) {
    // The résumé also answers the welcome questions.
    const place = placeOf(value.country);
    if (value.level && place) profile = { level: value.level, place };
    else profile = profile || { skipped: true };
    store.set("radar.profile", profile);
    view.sort = "";
  } else if (view.sort === "match") view.sort = "";
}

// [key, test, how to show its count]. Applied and Hidden only appear once they have something in them.
const TABS = [
  ["all", i => mark(i) !== "hidden"],
  ["new", i => isNew(i) && mark(i) !== "hidden", "count"],
  ["soon", i => isSoon(i) && mark(i) !== "hidden", "hot"],
  ["saved", i => saved.has(i.id), "count"],
  ["programs", i => i.source === "programs" && mark(i) !== "hidden"],
  ["applied", i => mark(i) === "applied", "count", "optional"],
  ["hidden", i => mark(i) === "hidden", "count", "optional"],
];
const tabTest = () => (TABS.find(tb => tb[0] === view.tab) || TABS[0])[1];

// Each filter as a test; `skip` leaves one out so its own chips can count what they would add.
const FILTER_TESTS = {
  q: i => view.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => `${i.title} ${i.org} ${i.location}`.toLowerCase().includes(w)),
  match: i => !!i._match && (view.match === "strong" ? i._match.level === 0 : i._match.level <= 1),
  fit: i => view.fit === "good" ? i._fit.level === 0 : i._fit.level === 0 || i._fit.level === 1,
  area: i => i.area === view.area,
  region: i => i.regions.includes(view.region),
  season: i => view.season === "breaks" ? fitsBreaks(i.season) : i.season === view.season,
  source: i => i.source === view.source,
  pay: i => !!i.pay,
};
function passes(i, skip) {
  for (const key of Object.keys(FILTER_TESTS)) if (key !== skip && view[key] && !FILTER_TESTS[key](i)) return false;
  return true;
}

function deadlineRank(i) { const d = daysLeft(i.deadline); return d === null ? 1e6 : d < 0 ? 2e6 - d : d; }
const newest = (a, b) => (b.added + b.posted).localeCompare(a.added + a.posted);
const matchScore = i => i._match ? i._match.score : 0;
const SORTS = {
  // Long shots (e.g. PhD-only roles for an undergrad) go last even when the skills match.
  match: (a, b) => (a._fit.level === 2) - (b._fit.level === 2) || matchScore(b) - matchScore(a) || a._fit.level - b._fit.level || deadlineRank(a) - deadlineRank(b),
  fit: (a, b) => a._fit.level - b._fit.level || matchScore(b) - matchScore(a) || deadlineRank(a) - deadlineRank(b) || newest(a, b),
  deadline: (a, b) => deadlineRank(a) - deadlineRank(b) || newest(a, b),
  added: newest,
  org: (a, b) => a.org.localeCompare(b.org) || a.title.localeCompare(b.title),
};

// ------------------------------------------------------------------ rendering helpers
function highlight(text) {
  const safe = esc(text);
  const words = view.q.trim().split(/\s+/).filter(w => w.length > 1).map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  return words.length ? safe.replace(new RegExp(`(${words.join("|")})`, "gi"), "<mark>$1</mark>") : safe;
}
function monthStrip(season) {

}
// {text, sub, cls} for a stated deadline, or null. "In N days" only when it's close.
function deadlineInfo(i) {

  if (d === null) return null;
  if (d < 0) return { text: fmtDate(i.deadline, false), sub: t("deadline.past"), cls: "past" };
  const left = d === 0 ? t("deadline.today") : d === 1 ? t("deadline.tomorrow") : t("deadline.in", d);
  return { text: fmtDate(i.deadline, false), sub: d <= SOON_DAYS ? left : "", cls: d <= SOON_DAYS ? "soon" : "" };
}
function deadlineCell(i) {

  return `<div class="deadline ${info.cls}">${esc(info.text)}${info.sub ? `<small>${esc(info.sub)}</small>` : ""}</div>`;
}
function whereCell(i) {

  const extra = locs.length - 1;

}
// Phones: where · deadline · pay on one line instead of four columns.
function metaLine(i) {
  const locs = locations(i);
  const parts = [];
  const where = locs.length ? highlight(locs[0]) + (locs.length > 1 ? ` ${t("more.locations", locs.length - 1)}` : "") : esc(regionNames(i).join(", "));
  if (where) parts.push(where);

  if (i.pay) parts.push(`<span class="mono">${esc(i.pay)}</span>`);
  return parts.length ? `<div class="meta-line">${parts.join(" · ")}</div>` : "";
}

    <div class="row-main" data-toggle="1" aria-expanded="${open}">
      <span class="fit ${fit.level < 0 ? "none" : FIT_CLASS[fit.level]}" title="${esc(fitTitle)}" role="img" aria-label="${esc(fitTitle)}"></span>
      <div class="role"><a href="${esc(i.url)}" target="_blank" rel="noopener">${highlight(i.title)}</a>
        <div class="org"><span>${highlight(i.org)}</span>${tags.slice(0, 2).join("")}</div>${why}${metaLine(i)}</div>
      ${whereCell(i)}
      <div class="pay ${i.pay ? "" : "none"}" title="${esc(i.pay || t("d.notStated"))}">${esc(i.pay || "—")}</div>
      ${whenCell(i.season)}
      ${deadlineCell(i)}
      <div class="actions">
        <button class="icon-btn save" data-act="save" aria-pressed="${isSaved}" title="${esc(t(isSaved ? "unsave" : "save"))}" aria-label="${esc(t("save"))}">${ICON_STAR(isSaved)}</button>
        <button class="icon-btn hide" data-act="hide" aria-pressed="${m === "hidden"}" title="${esc(t(m === "hidden" ? "unhide" : "hide"))}" aria-label="${esc(t("hide"))}">${ICON_HIDE}</button>
      </div>
    </div>
    ${open ? details(i) : ""}
  </div>`;
}
function matchDetails(i) {
  const m = i._match;
  if (!m) return "";
  if (!i.skills) return `<div><h4>${t("match")}</h4><p class="muted">${t("m.pending")}</p></div>`;
  const lines = [];
  if (m.area) lines.push(t("m.area", tv("area", i.area)));
  if (m.role) lines.push(t("m.role", m.role));
  if (!i.skills.length) lines.push(t("m.noSkills"));
  const chips = m.have.map(s => `<span class="skill hit">✓ ${esc(s)}</span>`).concat(m.missing.map(s => `<span class="skill miss">${esc(s)}</span>`)).join("");
  return `<div><h4>${t(`match.${m.level}`)}</h4>
    ${i.skills.length ? `<p>${m.have.length ? t("m.have", m.have.length, i.skills.length) : t("m.haveNone", i.skills.length)}</p><div class="skill-list">${chips}</div>` : ""}
    ${lines.length ? `<p class="muted">${esc(lines.join(" · "))}</p>` : ""}</div>`;
}
function details(i) {
  const fit = i._fit;
  const m = mark(i);
  const reasons = fit.level < 0 ? `<p class="muted">${t("d.noProfile")}</p>`
    : fit.reasons.length ? `<ul class="reasons">${fit.reasons.map(([l, x]) => `<li class="${FIT_CLASS[l]}">${esc(x)}</li>`).join("")}</ul>`
    : `<p>${t("d.noConflict")}</p>`;
  const locs = locations(i);
  const ns = `<span class="none">${t("d.notStated")}</span>`;
  const labels = [tv("area", i.area), ...i.warnings.map(w => tv("warn", w))].map(esc).join(" · ");
  const facts = [
    [t("d.where"), locs.length ? esc(locs.join(" · ")) : esc(regionNames(i).join(", ")) || ns],
    [t("d.when"), i.season === "unknown" ? ns : `${esc(seasonText(i.season))}${monthStrip(i.season)}`],
    [t("d.deadline"), i.deadline ? esc(fmtDate(i.deadline)) : `<span class="none">${t("d.deadlineNone")}</span>`],
    [t("d.pay"), i.pay ? `<span class="mono">${esc(i.pay)}</span>` : ns],
    [t("d.labels"), labels],
    [t("d.found"), esc(t("d.foundVia", fmtDate(i.added), i.source, i.posted ? fmtDate(i.posted) : "")) + (i.note ? `<br><span class="muted">${esc(i.note)}</span>` : "")],
  ];
  return `<div class="details">
    <div class="for-you">${matchDetails(i)}<div><h4>${fit.level < 0 ? t("d.foryou") : t(`fit.${fit.level}`)}</h4>${reasons}</div></div>
    <dl class="facts-list">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    <div class="detail-actions">
      <a class="btn primary-link" href="${esc(i.url)}" target="_blank" rel="noopener">${t("d.open")}</a>
      <button class="btn" data-act="applied" aria-pressed="${m === "applied"}">${t(m === "applied" ? "d.applied" : "d.markApplied")}</button>
      <button class="btn" data-act="save">${t(saved.has(i.id) ? "d.saved" : "d.save")}</button>
      <button class="btn" data-act="hide">${t(m === "hidden" ? "unhide" : "hide")}</button>
    </div>
  </div>`;
}

function chipGroup(name, values) {
  const box = document.querySelector(`.chips[data-filter="${name}"]`);
  box.innerHTML = values.map(([value, text, count]) =>
    `<button class="chip ${count === 0 ? "zero" : ""}" data-value="${esc(value)}" aria-pressed="${view[name] === value}">${esc(text)}${count != null ? `<small>${fmtN(count)}</small>` : ""}</button>`).join("");
}
function countBy(items, valuesOf, order) {
  const counts = {};
  items.forEach(i => valuesOf(i).forEach(v => counts[v] = (counts[v] || 0) + 1));
  return Object.keys(counts).sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99) || a.localeCompare(b));
}
function buildFilters(inTab) {
  // Counts show how many roles you'd see after clicking, given everything else you picked.
  // There is no "Any" chip: click a selected chip again to turn it off.
  const base = key => inTab.filter(i => passes(i, key));
  if (resume) {
    const pool = base("match");
    const n0 = pool.filter(i => i._match.level === 0).length, n1 = pool.filter(i => i._match.level === 1).length;
    chipGroup("match", [["strong", t("chip.match.strong"), n0], ["good", t("chip.match.good"), n0 + n1]]);
  } else chipGroup("match", []);
  if (hasProfile()) {
    const pool = base("fit");
    const n0 = pool.filter(i => i._fit.level === 0).length, n1 = pool.filter(i => i._fit.level === 1).length;
    chipGroup("fit", [["good", t("chip.fit.good"), n0], ["check", t("chip.fit.check"), n0 + n1]]);
  } else chipGroup("fit", []);
  const areaPool = base("area");
  chipGroup("area", countBy(areaPool, i => [i.area], AREA_ORDER).map(v => [v, tv("area", v), areaPool.filter(i => i.area === v).length]));
  const regionPool = base("region");
  chipGroup("region", countBy(regionPool, i => i.regions.filter(r => r !== "unknown"), REGION_ORDER).map(v => [v, tv("region", v), regionPool.filter(i => i.regions.includes(v)).length]));
  const seasonPool = base("season");
  const seasons = countBy(seasonPool, i => [i.season], SEASON_ORDER.slice(1)).filter(v => v !== "unknown" || view.season === "unknown");
  chipGroup("season", [["breaks", t("season.breaks"), seasonPool.filter(i => fitsBreaks(i.season)).length],
    ...seasons.map(v => [v, tv("season", v), seasonPool.filter(i => i.season === v).length])]);
  const sourcePool = base("source");
  const sources = countBy(sourcePool, i => [i.source], []);
  $("source").innerHTML = `<option value="">${t("filters.allSources")}</option>` + sources.map(s => `<option value="${esc(s)}">${esc(s)} (${fmtN(sourcePool.filter(i => i.source === s).length)})</option>`).join("");
  $("source").value = view.source;
  $("pay-only").checked = !!view.pay;
  if (view.pay || view.source) $("more-filters").open = true;
}
const FILTER_KINDS = { match: "chip.match", fit: "chip.fit", area: "area", region: "region", season: "season" };
function activeFilters() {
  const pills = [];
  if (view.q) pills.push(["q", t("pill.search", view.q)]);
  for (const [key, kind] of Object.entries(FILTER_KINDS)) if (view[key]) pills.push([key, tv(kind, view[key])]);
  if (view.source) pills.push(["source", view.source]);
  if (view.pay) pills.push(["pay", t("pill.pay")]);
  $("active-filters").innerHTML = pills.length
    ? pills.map(([key, text]) => `<button class="pill" data-clear="${key}" aria-label="${esc(t("pill.remove", text))}">${esc(text)}${ICON_X}</button>`).join("") + (pills.length > 1 ? `<button class="linkish" data-reset="1">${t("filters.clear")}</button>` : "")
    : "";
  $("filters-summary").textContent = pills.length ? t("filters.on", pills.length) : t("filters");
}

function render() {
  if (!DATA) return;
  const filtered = DATA.items.filter(i => passes(i));
  $("tabs").innerHTML = TABS.map(([key, test, count, optional]) => {
    const n = count ? filtered.filter(test).length : 0;
    if (optional && !n && view.tab !== key) return "";
    return `<button class="tab" role="tab" data-tab="${key}" aria-selected="${view.tab === key}">${t(`tab.${key}`)}${n ? `<small class="${count === "hot" ? "hot" : ""}">${fmtN(n)}</small>` : ""}</button>`;
  }).join("");

  const inTab = DATA.items.filter(tabTest());
  buildFilters(inTab);
  activeFilters();

  const list = inTab.filter(i => passes(i)).sort(SORTS[sortKey()]);
  $("sort").value = sortKey();
  $("rows").innerHTML = list.slice(0, view.shown).map(row).join("") || emptyState();
  $("count").textContent = t("count", fmtN(list.length), fmtDate(DATA.updated, false));
  $("more").hidden = list.length <= view.shown;
  $("more").textContent = t("more", Math.min(PAGE_SIZE, list.length - view.shown));
  writeHash();
}
function emptyState() {
  const filtersOn = !!document.querySelector("[data-clear]");
  const text = !filtersOn && ["saved", "applied", "hidden"].includes(view.tab) ? t(`empty.${view.tab}`) : t("empty.none");
  return `<div class="empty">${esc(text)}${filtersOn ? ` <button class="linkish" data-reset="1">${t("empty.clear")}</button>` : ""}</div>`;
}
const rerender = () => { view.shown = PAGE_SIZE; render(); };

function drawLegend() {
  $("legend").innerHTML = (hasProfile() ? `<div><span class="dot" style="color:var(--good);background:var(--good)"></span>${t("legend.good")}</div>
      <div><span class="dot" style="color:var(--check);background:var(--check-soft)"></span>${t("legend.check")}</div>
      <div><span class="dot" style="color:var(--long)"></span>${t("legend.long")}</div>` : "")
    + (resume ? `<div><span class="tag match"></span>${t("legend.match")}</div>` : "")
    + `<div><span class="sq" style="background:var(--good)"></span>${t("legend.break")}</div>
       <div><span class="sq" style="background:var(--check)"></span>${t("legend.class")}</div>
       <div><span class="sq" style="background:var(--semester)"></span>${t("legend.sem")}</div>`;
}
function toggleLegend(show) {
  $("legend").hidden = !show;
  $("legend-btn").setAttribute("aria-expanded", String(show));
}

// ------------------------------------------------------------------ language switch
function applyLanguage() {
  document.documentElement.lang = LANG === "pt" ? "pt-BR" : "en";
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-t-html]").forEach(el => { el.innerHTML = t(el.dataset.tHtml); });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG));
  $("help").innerHTML = t("help.body");
  $("search").placeholder = t("search.placeholder");
  $("search").setAttribute("aria-label", t("search.placeholder"));
  document.querySelector(".search kbd").title = t("search.kbd");
  $("github-link").title = t("top.github");
  $("github-link").setAttribute("aria-label", t("top.github"));
  $("to-top").setAttribute("aria-label", t("top.toTop"));
  $("source").setAttribute("aria-label", t("filters.source"));
  $("welcome-count").textContent = DATA ? t("welcome.count", fmtN(DATA.items.length), fmtDate(DATA.updated)) : t("loading");
  drawPlaces();
}
function setLanguage(lang) {
  LANG = lang;
  store.set("radar.lang", lang);
  applyLanguage();
  if (!$("resume").hidden) { $("prompt-text").value = resumePrompt(DATA?.skillNames || []); $("copy-status").textContent = ""; if (!$("resume-saved").hidden) renderResumeSummary(); }
  if (!$("app").hidden) showApp();
}

// ------------------------------------------------------------------ events
document.addEventListener("click", e => {
  const langBtn = e.target.closest("[data-lang]");
  if (langBtn) return setLanguage(langBtn.dataset.lang);
  if (e.target.closest("#legend-btn")) return toggleLegend($("legend").hidden);
  if (!$("legend").hidden && !e.target.closest("#legend")) toggleLegend(false);
  const chip = e.target.closest(".chip");
  if (chip) { const f = chip.parentElement.dataset.filter; view[f] = view[f] === chip.dataset.value ? "" : chip.dataset.value; return rerender(); }
  const tab = e.target.closest(".tab");
  if (tab) { view.tab = tab.dataset.tab; return rerender(); }
  const pill = e.target.closest("[data-clear]");
  if (pill) { view[pill.dataset.clear] = ""; if (pill.dataset.clear === "q") $("search").value = ""; return rerender(); }
  if (e.target.closest("[data-reset]")) return resetFilters();
  const act = e.target.closest("[data-act]");
  if (act) {
    const id = act.closest(".row").dataset.id;
    const item = DATA.items.find(i => i.id === id);
    if (act.dataset.act === "save") toggleSave(id);
    if (act.dataset.act === "hide") setMark(item, "hidden");
    if (act.dataset.act === "applied") setMark(item, "applied");
    return render();
  }
  if (e.target.closest("a")) return;  // links open the posting
  const toggle = e.target.closest("[data-toggle]");
  if (toggle) {
    const id = toggle.closest(".row").dataset.id;
    view.open.has(id) ? view.open.delete(id) : view.open.add(id);
    render();
  }
});
function resetFilters() {
  Object.assign(view, { match: "", fit: "", area: "", region: "", season: "", source: "", pay: "", q: "" });
  $("search").value = "";
  rerender();
}
let searchTimer;
$("search").addEventListener("input", e => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { view.q = e.target.value.trim(); rerender(); }, 120); });
$("source").addEventListener("change", e => { view.source = e.target.value; rerender(); });
$("pay-only").addEventListener("change", e => { view.pay = e.target.checked ? "1" : ""; rerender(); });
$("sort").addEventListener("change", e => { view.sort = e.target.value; rerender(); });
$("more").addEventListener("click", () => { view.shown += PAGE_SIZE; render(); });
$("profile-chip").addEventListener("click", showWelcome);
$("to-top").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
window.addEventListener("scroll", () => { $("to-top").hidden = $("app").hidden || window.scrollY < 1200; }, { passive: true });
document.addEventListener("keydown", e => {
  const typing = /input|select|textarea/i.test(document.activeElement?.tagName || "");
  if (e.key === "/" && !typing && !$("app").hidden) { e.preventDefault(); $("search").focus(); }
  if (e.key === "Escape") {
    if (!$("legend").hidden) return toggleLegend(false);
    if (view.open.size) { view.open.clear(); render(); }
  }
});
window.addEventListener("hashchange", () => { readHash(); $("search").value = view.q; rerender(); });
// Load the next page by itself when "Show more" scrolls into view.
if ("IntersectionObserver" in window) {
  new IntersectionObserver(entries => { if (entries[0].isIntersecting && !$("more").hidden) $("more").click(); }, { rootMargin: "400px" }).observe($("more"));
}
if (window.matchMedia("(max-width: 900px)").matches) $("filters").open = false;

// ------------------------------------------------------------------ start
applyLanguage();
$("search").value = view.q;
profile ? showApp() : showWelcome();
fetch("data.json", { cache: "no-cache" })
  .then(r => r.json())
  .then(data => {
    DATA = data;
    applyLanguage();
    $("sources").innerHTML = data.sources.map(s =>
      `<tr><td>${esc(s.name)}</td><td>${s.status === "ok" ? "ok" : `<b>${esc(s.status)}</b>`}</td><td class="mono">${fmtN(s.items)}</td><td>${s.problems.map(esc).join("<br>")}</td></tr>`).join("");
    if (!$("app").hidden) showApp();
    if (!$("resume").hidden) $("prompt-text").value = resumePrompt(data.skillNames || []);
  })
  .catch(() => {
    $("rows").innerHTML = `<div class="empty">${t("loadError")}</div>`;
    $("welcome-count").textContent = t("welcome.loadError");
  });
</script>
</body>
</html>
