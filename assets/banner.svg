      <stop offset="0" stop-color="#0b1a16"/>
      <stop offset=".55" stop-color="#0f2a23"/>
      <stop offset="1" stop-color="#173a2a"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#d4f05a" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#c9e84a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#c9e84a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c9e84a" stop-opacity=".22"/>
      <stop offset="1" stop-color="#c9e84a" stop-opacity="0"/>
    </radialGradient>
    <style>
      @font-face { font-family: "BG"; src: url(data:font/woff2;base64,) format("woff2"); font-weight: 700; }
      @font-face { font-family: "SG"; src: url(data:font/woff2;base64,) format("woff2"); font-weight: 500; }
      .title { font: 700 104px "BG", "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -3px; fill: #eef6e9; }
      .lume { fill: #d4f05a; }
