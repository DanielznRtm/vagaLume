ers, span the globe and require managers to keep the big picture in focus while being able to dive into the unique engineering challenges we face daily. As a Technical Program Manager at Google, you lead complex, multi-disciplinary engineering projects using your engineering expertise. You plan requirements with internal customers and usher projects through the entire project lifecycle. This includes managing project schedules, identifying risks and clearly commu"], [3, 2], [1789391903, 173000000], [1790100436, 985000000], [1790100437, 307000000], [null, "<p>Please complete your application before<b> October 9, 2026.</b></p><p>Applications will be reviewed on a rolling basis and it’s in a candidate’s best interest to apply early.</p><p>Timing on when you can hear back will vary and can take upwards of 90+ days. If you haven’t heard from us in three months about your application, we likely proceeded with other candidates for the role. </p><p>Participation in the internship program requires that you are located in the United States for the duration of the internship program.</p><p>This internship is intended for students in their penultimate academic year or returning to a degree program after completion of the internship and who are pursuing a Bachelor's or Master's degree program in Computer Science or a related field.</p><p>Google is a global company and, in order to facilitate efficient collaboration and communication globally, English proficiency is a requirement for this internship program.</p><p><br>To start the application process, you will need an updated CV or resume and a current unofficial or official transcript in English. Click on the “Apply” button on this page and provide the required materials in the appropriate sections (PDFs preferred):</p><ol><li>In the “Resume Section:” attach an updated CV or resume.</li><ul><li><b>Please ensure you’ve listed your anticipated graduation date (in MM/YY)</b> </li></ul><li>In the “Education Section:” attach a current or recent unofficial or official transcript in English.</li><ul><li>Under “Degree Status,” select “Now attending” to upload a transcript.</li></ul></ol><div>In accordance with Washington state law, we are highlighting our comprehensive benefits package, which is available to all eligible US based Interns. Benefits for this role include: <br><ul><li>Health, dental, vision insurance</li><li>Sick Time: 40 hours/year (increased to 69 hours/year for Seattle) including 5 discretionary sick days per instance </li><li>Holidays: 13 paid days per year</li></ul><div><p>This role may also be located in our Playa Vista, CA campus.</p><p>Applicants in the County of Los Angeles: Qualified applications with arrest or conviction records will be considered for employment in accordance with the Los Angeles County Fair Chance Ordinance for Employers and the California Fair Chance Act.</p><p>Applicants in San Francisco: Qualified applications with arrest or conviction records will be considered for employment in accordance with the San Francisco Fair Chance Ordinance for Employers and the California Fair Chance Act.</p></div></div>"], null, null, [null, "Note: By applying to this position you will have an opportunity to share your preferred working location from the following: <b>Mountain View, CA, USA; Ann Arbor, MI, USA; Atlanta, GA, USA; Austin, TX, USA; Boulder, CO, USA; Bellevue, WA, USA; Cambridge, MA, USA; Chicago, IL, USA; Irvine, CA, USA; Kirkland, WA, USA; Los Angeles, CA, USA; Madison, WI, USA; New York, NY, USA; Palo Alto, CA, USA; Portland, OR, USA; Pittsburgh, PA, USA; Raleigh, NC, USA; Durham, NC, USA; Reston, VA, USA; Redmond, WA"], [null, "<ul>\n<li>Currently pursuing a Bachelor’s or Master's degree in Computer Science, or a related field.</li>\n<li>Experience with one or more general purpose programming languages including: Java, C/C++, Go, or Python.<br></li>\n<li>Experience leading entrepreneurial efforts, outreach within organizations or project management experience through class projects, clubs, or internships.<br></li>\n</ul>"], 5], ["91436104816698054", "Software Engineering Intern, PhD, Summer 2027", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckcbfZ9iGy", [null, "<ul>\n<li>Develop scripts to automate routine tasks.<br></li>\n<li>Analyze information and evaluate results to choose the best solution to effectively solve issues.<br></li>\n<li>Apply knowledge gained in computer science courses to real world challenges.<br></li>\n<li>Create and support a productive and innovative team including working with peers, managers, and teams.</li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li>Pursuing a PhD program in Computer Science or a related technical field.</li>\n<li>Experience coding in one of the following programming languages including but not limited to: C, C++, Java, or Python.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Currently attending a degree program in the US and available to work full time for 12 weeks outside of university term time.<br></li>\n<li>In their penultimate academic year or returning to a degree pro"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc", null, "Google", "en-US", [["Mountain View, CA, USA", ["NASA Ames Building N-255, 100 Bay Vw Dr, Mountain View, CA 94043, USA"], "Mountain View", "94043", "CA", "US"], ["Atlanta, GA, USA", ["Atlanta, GA, USA"], "Atlanta", null, "GA", "US"], ["Austin, TX, USA", ["Austin, TX, USA"], "Austin", null, "TX", "US"], ["Boulder, CO, USA", ["Boulder, CO, USA"], "Boulder", null, "CO", "US"], ["Cambridge, MA, USA", ["Cambridge, MA, USA"], "Cambridge", null, "MA", "US"], ["Bellevue, WA, USA", ["Bellevue, WA, USA"], "Bellevue", null, "WA", "US"], ["Chicago, IL, USA", ["Chicago, IL, USA"], "Chicago", null, "IL", "US"], ["Irvine, CA, USA", ["Irvine, CA, USA"], "Irvine", null, "CA", "US"], ["Kirkland, WA, USA", ["Kirkland, WA, USA"], "Kirkland
