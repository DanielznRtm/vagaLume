iability.</li></ul><p><strong>Qualifications and Education Requirements</strong></p><ul><li>Pursue a degree in Electrical Engineering, Computer Engineering, or a related discipline.</li><li>Demonstrate working knowledge of electronic circuits, component data sheets, and specifications.</li><li>Demonstrate familiarity with programming languages such as C, C++, or C#.</li><li>Demonstrate proficiency with electronic test equipment such as oscilloscopes, digital multimeters, and power supplies.</li><li>Candidates must be a U.S. Person, defined as either a U.S. citizen or a lawful permanent resident (Green Card holder), and must be able to provide appropriate documentation upon hire to verify this status. Please note that some positions involve sensitive customer contracts and require U.S. citizenship as a condition of employment.&nbsp;</li></ul><p><strong>Preferred Skills</strong></p><ul><li>Demonstrate familiarity with communication protocols such as USB, Ethernet, or serial interfaces.</li><li>Demonstrate exposure to Linux environments.</li><li>Demonstrate strong analytical, communication, and problem-solving skills.</li></ul><p><strong>Work Schedule and Environment</strong></p><ul><li>Monday to Friday, Day Shift</li><li>Discretionary 9/80 Schedule</li><li>Business casual dress code</li></ul><p><strong>Full-time schedules for Summer internships. Approx. Start Date End of May/Beg of June.</strong> <strong>Internship salary is based on position and academic year standing.</strong>&nbsp;</p><p><br/></p><p>NAI is proud to be an Equal Opportunity Employer. <a href=\"https://www.naii.com/equalopportunity\"><u>Read our full EEO/AAP statement</u></a>.&nbsp;&nbsp;&nbsp;&nbsp;</p>","jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","streetAddress":"116 Wilbur Pl","addressLocality":"Bohemia","addressRegion":"NY","postalCode":"11716","addressCountry":"US"}},"baseSalary":{"@type":"MonetaryAmount","currency":"USD","value":{"@type":"QuantitativeValue","minValue":17.50
